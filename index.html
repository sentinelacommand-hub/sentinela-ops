
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo - Sentinela Ops</title>
    
    <!-- Bibliotecas Externas -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 0; }
        
        /* Login */
        #secao-login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        .login-box { background: white; padding: 30px; border-radius: 12px; shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        
        /* App Layout */
        #secao-app { display: none; padding: 15px; }
        header { background: var(--primary); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-admin { background: #2563eb; color: white; display: none; } /* Escondido por padrão */
        
        .ronda-item { border-left: 4px solid var(--success); padding: 10px; margin-bottom: 10px; background: #f9f9f9; font-size: 14px; }
        #sec-fiscalizacao { display: none; background: #fff3cd; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="secao-login">
        <div class="login-box">
            <h2>Sentinela Ops</h2>
            <p>Operacional de Campo</p>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button class="btn-success" onclick="fazerLogin()">Entrar</button>
            <p id="erro-login" style="color:red; font-size:12px;"></p>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APP -->
    <div id="secao-app">
        <header>
            <span>Olá, <b id="nome-usuario">...</b></span>
            <button onclick="fazerLogout()" style="width:auto; margin:0; padding:5px 10px; font-size:12px;" class="btn-danger">Sair</button>
        </header>

        <!-- Botão exclusivo para Admin -->
        <button id="btn-add-posto" class="btn-admin" onclick="alert('Abrir tela de cadastro de posto...')">➕ Cadastrar Novo Posto</button>

        <!-- Formulário de Ronda -->
        <div class="card">
            <h3>Registrar Visita</h3>
            <select id="r-posto" onchange="atualizarSelectPostos()"><option value="">Carregando postos...</option></select>
            <input type="number" id="r-km" placeholder="KM Atual">
            <select id="r-motivo" onchange="toggleFiscalizacao()">
                <option value="Ronda">Ronda</option>
                <option value="Fiscalização">Fiscalização</option>
                <option value="Apoio">Apoio</option>
            </select>

            <div id="sec-fiscalizacao">
                <label><input type="checkbox" onclick="toggleCheck(this)"> Postura/Uniforme OK</label><br>
                <label><input type="checkbox" onclick="toggleCheck(this)"> Livro de Atas OK</label>
            </div>

            <input type="text" id="r-func" placeholder="Funcionário no Posto">
            <textarea id="r-obs" placeholder="Observações..."></textarea>
            
            <label style="font-size:12px;">Foto da Visita:</label>
            <input type="file" id="r-foto" accept="image/*" capture="camera" onchange="previewImage(this)">
            
            <button class="btn-success" onclick="salvarRonda()">Finalizar Visita</button>
        </div>

        <!-- Perfil e Relatório -->
        <div class="card">
            <h3>Meu Perfil</h3>
            <input type="text" id="p-nome" placeholder="Nome Completo">
            <input type="text" id="p-matrícula" placeholder="Matrícula">
            <input type="text" id="p-cargo" placeholder="Cargo">
            <input type="text" id="p-placa" placeholder="Placa do Veículo">
            <input type="text" id="p-empresa" placeholder="Empresa">
            <input type="text" id="p-cnpj" placeholder="CNPJ">
            <button class="btn-success" onclick="salvarPerfil()">Salvar Perfil</button>
        </div>

        <button class="btn-success" style="background:#6c757d" onclick="gerarRelatorioPlantao()">📄 Gerar PDF do Plantão</button>
        <button class="btn-danger" onclick="zerarNovoPlantao()">🔄 Iniciar Novo Plantão (Zerar)</button>

        <div id="lista-rondas-recente"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBL4Nka91iGIAWSTfvAmsqDHCj2KMhWZ70",
            authDomain: "sentinela-ops-profissional.firebaseapp.com",
            projectId: "sentinela-ops-profissional",
            storageBucket: "sentinela-ops-profissional.firebasestorage.app",
            messagingSenderId: "458111218365",
            appId: "1:458111218365:web:0f3b41ab7c2ceb7feebdd4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const fs = firebase.firestore();

        const usuariosAutorizados = ['admin@sentinela.com', 'gerencia@sentinela.com'];
        let db = { perfil: {}, rondas: [], postos: [] };
        let fotoBase64 = "";

        // --- AUTENTICAÇÃO (ATUALIZADO) ---
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                let eAdmin = false;
                try {
                    const docUser = await fs.collection("usuarios").doc(user.uid).get();
                    if (docUser.exists) {
                        db.perfil = docUser.data();
                        if (db.perfil.role === "admin") eAdmin = true;
                        preencherCamposPerfil();
                    }
                } catch (err) { console.log("Erro permissão:", err); }

                // Mostra botão de admin se for autorizado (Não expulsa mais usuários comuns!)
                if (usuariosAutorizados.includes(user.email) || eAdmin) {
                    document.getElementById('btn-add-posto').style.display = 'block';
                }

                document.getElementById('secao-login').style.display = 'none';
                document.getElementById('secao-app').style.display = 'block';
                document.getElementById('nome-usuario').innerText = user.displayName || user.email;
                
                carregarPostos();
            } else {
                document.getElementById('secao-login').style.display = 'flex';
                document.getElementById('secao-app').style.display = 'none';
            }
        });

        function fazerLogin() {
            auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('senha').value)
                .catch(e => document.getElementById('erro-login').innerText = "Erro ao entrar.");
        }

        function fazerLogout() { auth.signOut(); }

        // --- POSTOS ---
        async function carregarPostos() {
            const snap = await fs.collection('postos').get();
            db.postos = snap.docs.map(doc => doc.data());
            atualizarSelectPostos();
        }

        function atualizarSelectPostos() {
            const sel = document.getElementById('r-posto');
            sel.innerHTML = '<option value="">Selecione o posto...</option>';
            db.postos.forEach(p => sel.innerHTML += `<option value="${p.nome}">${p.nome}</option>`);
        }

        // --- RONDAS ---
        async function salvarRonda() {
            const r = {
                uid: auth.currentUser.uid,
                colaborador: db.perfil.nome || auth.currentUser.email,
                posto: document.getElementById('r-posto').value,
                km: document.getElementById('r-km').value,
                motivo: document.getElementById('r-motivo').value,
                obs: document.getElementById('r-obs').value,
                funcionarioPosto: document.getElementById('r-func').value,
                data: new Date().toISOString().split('T')[0],
                hora: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            await fs.collection('rondas').add(r);
            db.rondas.push(r);
            alert("✅ Visita registrada!");
            limparFormRonda();
            saveLocal();
        }

        async function zerarNovoPlantao() {
            const confirmar = confirm("ATENÇÃO!\n\nEsta ação irá apagar todas as rondas registradas do usuário logado para iniciar um novo plantão.\n\nDeseja continuar?");
            if (!confirmar) return;
            try {
                await excluirRondasFirebaseUsuario(auth.currentUser.uid);
                db.rondas = [];
                saveLocal();
                alert("✅ Rondas zeradas com sucesso!");
            } catch (e) { alert("Erro ao zerar: " + e.message); }
        }

        async function excluirRondasFirebaseUsuario(uid) {
            const snap = await fs.collection("rondas").where("uid", "==", uid).get();
            const batch = fs.batch();
            snap.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
        }

        // --- PERFIL ---
        async function salvarPerfil() {
            const p = {
                nome: document.getElementById('p-nome').value,
                matricula: document.getElementById('p-matrícula').value,
                cargo: document.getElementById('p-cargo').value,
                placa: document.getElementById('p-placa').value.toUpperCase(),
                empresa: document.getElementById('p-empresa').value,
                cnpj: document.getElementById('p-cnpj').value
            };
            await fs.collection("usuarios").doc(auth.currentUser.uid).set(p, {merge: true});
            db.perfil = p;
            alert("✅ Perfil salvo!");
        }

        function preencherCamposPerfil() {
            const p = db.perfil;
            document.getElementById('p-nome').value = p.nome || "";
            document.getElementById('p-matrícula').value = p.matricula || "";
            document.getElementById('p-cargo').value = p.cargo || "";
            document.getElementById('p-placa').value = p.placa || "";
            document.getElementById('p-empresa').value = p.empresa || "";
            document.getElementById('p-cnpj').value = p.cnpj || "";
        }

        // --- AUXILIARES ---
        function toggleCheck(el) { el.classList.toggle('ok'); }
        function toggleFiscalizacao() {
            const m = document.getElementById('r-motivo').value;
            document.getElementById('sec-fiscalizacao').style.display = (m === 'Fiscalização') ? 'block' : 'none';
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 800;
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function limparFormRonda() {
            document.getElementById('r-km').value = "";
            document.getElementById('r-obs').value = "";
            document.getElementById('r-func').value = "";
            fotoBase64 = "";
            document.getElementById('r-foto').value = "";
        }

        function saveLocal() { localStorage.setItem('sentinela_db', JSON.stringify(db)); }

        function gerarRelatorioPlantao() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const p = db.perfil;
            let y = 20;
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("RELATÓRIO DE PLANTÃO OPERACIONAL", 105, y, { align: "center" });
            y += 15;
            doc.setFontSize(10);
            doc.text("DADOS DO OPERADOR", 10, y);
            y += 6;
            doc.setFont("helvetica", "normal");
            doc.text(`Operador: ${p.nome || "N/A"}`, 10, y);
            doc.text(`Cargo: ${p.cargo || "N/A"}`, 100, y);
            y += 5;
            doc.text(`Matrícula: ${p.matricula || "N/A"}`, 10, y);
            doc.text(`Data do Relatório: ${new Date().toLocaleDateString('pt-BR')}`, 100, y);
            y += 10;
            doc.setLineWidth(0.5); doc.line(10, y, 200, y); y += 10;
            doc.setFont("helvetica", "bold"); doc.text("REGISTROS DE ATIVIDADES", 10, y); y += 8;
            db.rondas.forEach((r, index) => {
                if(y > 260) { doc.addPage(); y = 20; }
                doc.setFont("helvetica", "bold"); doc.setFontSize(9);
                doc.text(`${index + 1}. POSTO: ${r.posto.toUpperCase()}`, 10, y);
                y += 5; doc.setFont("helvetica", "normal");
                doc.text(`Hora: ${r.hora} | Colaborador: ${r.colaborador}`, 15, y);
                y += 5; doc.text(`Motivo: ${r.motivo} | KM: ${r.km}`, 15, y);
                y += 5; const obs = doc.splitTextToSize(`Obs: ${r.obs}`, 180); doc.text(obs, 15, y);
                y += (obs.length * 5) + 5; doc.setDrawColor(200); doc.line(15, y - 2, 195, y - 2); y += 5;
            });
            doc.save(`Relatorio_Plantao_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.pdf`);
        }
    </script>
</body>
</html>
