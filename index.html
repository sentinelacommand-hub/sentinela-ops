<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TacticalOps - Sistema de Rondas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="dark-theme">
    
    <div id="loader" class="loader">Carregando Sistema...</div>

    <!-- Navegação Sidebar -->
    <nav id="sidebar" class="hidden">
        <div class="logo">TACTICAL<span>OPS</span></div>
        <ul class="nav-links">
            <li onclick="router.navigate('home')">Dashboard</li>
            <li onclick="router.navigate('rondas')">Rondas</li>
            <li onclick="router.navigate('postos')">Postos</li>
            <li id="admin-link" onclick="router.navigate('usuarios')" class="hidden">Usuários</li>
            <li onclick="router.navigate('perfil')">Perfil</li>
            <li onclick="auth.logout()" class="logout-btn">Sair</li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main id="app"></main>

    <!-- Mobile Navigation -->
    <nav id="bottom-nav" class="hidden">
        <button onclick="router.navigate('home')">Home</button>
        <button onclick="router.navigate('rondas')">Ronda</button>
        <button onclick="router.navigate('perfil')">Perfil</button>
    </nav>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
